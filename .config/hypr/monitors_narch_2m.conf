# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and available modes: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# narch dual-monitor setup from `hyprctl monitors`:
# - DP-1: Microstep MSI AG321CQR, 2560x1440@59.951 (primary)
# - eDP-1: LG Display 0x062E, 1920x1080@59.977 (secondary)
env = GDK_SCALE,1

$MONITOR_PRIMARY = desc:Microstep MSI AG321CQR DB4H081402289
$MONITOR_SECONDARY = eDP-1

# The laptop panel is on the left; the larger primary monitor is on the right.
$PRIMARY_POS = 1920x0
$SECONDARY_POS = 0x0

monitor=$MONITOR_PRIMARY,2560x1440@59.95,$PRIMARY_POS,1
monitor=$MONITOR_SECONDARY,1920x1080@59.98,$SECONDARY_POS,1

# Five persistent workspaces on the primary monitor.
workspace = 1, monitor:$MONITOR_PRIMARY, persistent:true
workspace = 2, monitor:$MONITOR_PRIMARY, persistent:true
workspace = 3, monitor:$MONITOR_PRIMARY, persistent:true, default:true
workspace = 4, monitor:$MONITOR_PRIMARY, persistent:true
workspace = 5, monitor:$MONITOR_PRIMARY, persistent:true

# Three persistent workspaces on the secondary laptop panel.
workspace = 6, monitor:$MONITOR_SECONDARY, persistent:true
workspace = 7, monitor:$MONITOR_SECONDARY, persistent:true
workspace = 8, monitor:$MONITOR_SECONDARY, persistent:true
